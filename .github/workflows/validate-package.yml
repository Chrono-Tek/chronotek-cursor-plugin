name: Validate Cursor plugin package

on:
  pull_request:
  push:
    branches:
      - main
      - codex/mcp-v9-compatibility

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package files and certification consistency
        run: node scripts/validate-package.mjs
